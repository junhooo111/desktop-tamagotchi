# 푸시·PR 마다 Windows 와 macOS 에서 시험을 돌리고, 앱을 실제로 띄워 보는 스모크(--smoke)도 시도한다.
# 맥이 없는 개발 환경이라, 맥에서 깨지는 것(경로·네이티브 모듈·창)을 여기서 잡는다.
# 맥 러너에서도 앱 스모크(SMOKE_OK)가 통과함을 확인했다(2026-11-28).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: App smoke
        run: npm run smoke
