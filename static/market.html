<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>경매장</title>
    <link rel="stylesheet" href="./market.css" />
  </head>
  <body>
    <main>
      <h1>경매장</h1>
      <p class="hint" id="wallet"></p>
      <div class="tabs" id="cats" role="tablist">
        <button type="button" role="tab" data-cat="pets" aria-selected="true">동물</button>
        <button type="button" role="tab" data-cat="cosmetics" aria-selected="false">꾸미기</button>
      </div>
      <div class="tabs" id="modes" role="tablist">
        <button type="button" role="tab" data-mode="buy" aria-selected="true">사기</button>
        <button type="button" role="tab" data-mode="sell" aria-selected="false">팔기</button>
        <span id="filter-box">
          <select id="sort" aria-label="정렬"><option value="cheap">싼 순</option><option value="pricey">비싼 순</option><option value="grade">등급 높은 순</option></select>
          <select id="grade-filter" aria-label="등급"><option value="all">모든 등급</option></select>
          <label class="check"><input id="only-new" type="checkbox" /> 안 가진 것만</label>
        </span>
      </div>
      <ul class="list" id="list"></ul>
      <p class="hint" id="note"></p>
      <footer>
        <button id="close" type="button">닫기</button>
      </footer>
    </main>
    <script type="module" src="../dist/renderer/market.js"></script>
  </body>
</html>
