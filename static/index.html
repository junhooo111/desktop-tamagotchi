<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>desktop-tamagotchi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="pet" width="460" height="410"></canvas>
    <div id="bubble" hidden></div>
    <section id="tip" hidden aria-live="polite">
      <span class="tag">FE 지식</span>
      <strong id="tip-title"></strong>
      <p id="tip-body"></p>
      <pre id="tip-code" hidden></pre>
      <div class="actions">
        <button id="tip-toggle" type="button" class="ghost">코드 보기</button>
        <button id="tip-ok" type="button">확인</button>
      </div>
    </section>
    <script type="module" src="../dist/renderer/renderer.js"></script>
  </body>
</html>
