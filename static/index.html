<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>desktop-tamagotchi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="pet" width="460" height="400"></canvas>
    <div id="bubble" hidden></div>
    <section id="status" hidden aria-live="polite">
      <div class="st-head"><strong id="st-name"></strong><span id="st-lv" class="lv"></span></div>
      <p id="st-sub"></p>
      <div id="st-bars"></div>
    </section>
    <section id="notice" hidden aria-live="polite">
      <span class="tag">문제 발견</span>
      <strong id="notice-title"></strong>
      <p id="notice-where"></p>
      <p class="fix"><b>이렇게 고쳐요</b><span id="notice-fix"></span></p>
      <p class="hint">펫을 누르면 자세히 알려 줄게요</p>
    </section>
    <section id="tip" hidden aria-live="polite">
      <span class="tag">FE 지식</span>
      <strong id="tip-title"></strong>
      <p id="tip-body"></p>
      <pre id="tip-code" hidden></pre>
      <div class="actions">
        <button id="tip-toggle" type="button" class="ghost">코드 보기</button>
        <button id="tip-ok" type="button">확인</button>
      </div>
    </section>
    <script type="module" src="../dist/renderer/renderer.js"></script>
  </body>
</html>
